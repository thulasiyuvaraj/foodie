<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My orders | Foodie</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-icon">F</span> foodie<span class="dot">.</span></a><nav><a class="nav-link" th:href="@{/}">Home</a><a class="cart-link" th:href="@{/cart}">🛒 Cart</a></nav></header><main class="page-wrap"><p class="eyebrow">YOUR FOODIE HISTORY</p><h1 class="page-title">My orders<span class="dot">.</span></h1><div class="orders-list" th:if="${!orders.isEmpty()}"><article class="order-card" th:each="order : ${orders}"><div class="order-top"><div><p class="order-number">Order #<b th:text="${order.id}">1</b></p><small th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</small></div><span class="status">✓ Placed</span></div><div class="order-items" th:each="item : ${order.items}"><span th:text="${item.quantity} + ' × ' + ${item.foodName}">1 × Burger</span><span th:text="'₹' + ${#numbers.formatDecimal(item.lineTotal, 1, 2)}">₹149</span></div><div class="summary-line total-line"><b>Total paid (demo)</b><b th:text="'₹' + ${#numbers.formatDecimal(order.total, 1, 2)}">₹149</b></div><p class="secure-note">Deliver to: <span th:text="${order.address}">Address</span></p></article></div><div class="empty-state" th:if="${orders.isEmpty()}"><div class="empty-emoji">🍽️</div><h2>No orders yet</h2><p>Your next favourite meal is just a click away.</p><a class="primary-btn" th:href="@{/}">Explore menu <span>→</span></a></div></main><footer>Made with <span>♥</span> for food lovers · Foodie FSD Project</footer></body></html>
