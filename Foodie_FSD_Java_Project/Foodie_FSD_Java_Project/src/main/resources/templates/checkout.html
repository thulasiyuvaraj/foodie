<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Foodie</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-icon">F</span> foodie<span class="dot">.</span></a><nav><a class="nav-link" th:href="@{/cart}">← Back to cart</a></nav></header><main class="page-wrap"><p class="eyebrow">ALMOST THERE</p><h1 class="page-title">Checkout<span class="dot">.</span></h1>
<div class="checkout-layout"><form class="checkout-card" th:action="@{/checkout}" method="post"><h2>Delivery details</h2><label for="customerName">Full name</label><input id="customerName" name="customerName" required maxlength="100" placeholder="Enter your name"><label for="phone">Phone number</label><input id="phone" name="phone" required pattern="[0-9+() -]{7,20}" placeholder="Enter phone number"><label for="address">Delivery address</label><textarea id="address" name="address" rows="4" required maxlength="1000" placeholder="Door number, street, city, pincode"></textarea><button class="primary-btn full-btn" type="submit">Place demo order <span>→</span></button><p class="secure-note">Demo project only — no payment will be collected.</p></form>
<aside class="summary-card"><h2>Your order</h2><div class="summary-food" th:each="entry : ${entries}"><span th:text="${entry.quantity} + ' × ' + ${entry.food.name}">1 × Burger</span><b th:text="'₹' + ${#numbers.formatDecimal(entry.lineTotal, 1, 2)}">₹149</b></div><div class="summary-line"><span>Delivery</span><span class="free">FREE</span></div><div class="summary-line total-line"><b>Total</b><b th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹149</b></div></aside></div></main><footer>Made with <span>♥</span> for food lovers · Foodie FSD Project</footer></body></html>
